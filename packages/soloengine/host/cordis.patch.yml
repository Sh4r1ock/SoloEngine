# SoloEngine 组合层（profile 的最后一个 bundle 层）。
#
# 本层在 dsh-base 与 dsh-web-app 之上叠加 SoloEngine 的差异，全部为「原生形态注入」
# （PRD-01 FR-ARCH-050）：技能发现自定义根、运行面板不设模型分节、以及框架层挂载行。
# 不做数据转换层、不做双写。
#
# **数据库形态不写在本层**：单机（SQLite）与云（PostgreSQL）各自是一份形态覆盖文件
# `cordis.form-single.patch.yml` / `cordis.form-cloud.patch.yml`，由启动器按
# `SOLOENGINE_DB_FORM` 以 `--patch` 叠加。两套插件（键值后端、会话日志、会话检索）
# 都随包安装，启动时只激活对应那套；打包产物恒取单机形态，把三个 PG 流程级插件
# 整组替换为三个 SQLite 插件（本层因此保持形态中立，不需要在产物里改条件）。
#
# 环境变量（由 soloengine-launch 设置，未设置即加载期报错——无回退默认值）：
#   SOLOENGINE_ROOT  实例根目录（data/ 的父级）
#   SOLOENGINE_DB    业务库绝对路径（data/database/soloengine.db）
#   SOLOENGINE_DB_FORM  数据库形态（single | cloud）
#   SOLOENGINE_DATABASE_URL  云形态 PostgreSQL 连接串
#   SOLOENGINE_KEYS_DIR   主密钥目录（data/home/keys，DB 密钥模型适配器解密用）
#   SOLOENGINE_SKILLS_DIR  框架层技能目录（技能发现的自定义根）

- insert:
    # 框架层挂载：Express REST 挂进 host-webserver 的同一条 HTTP 服务（唯一端口）。
    - id: soloengine-host
      name: '@soloengine/host'
      config:
        root: !!js process.env.SOLOENGINE_ROOT
        databasePath: !!js process.env.SOLOENGINE_DB
        databaseForm: !!js process.env.SOLOENGINE_DB_FORM
        databaseUrl: !!js process.env.SOLOENGINE_DATABASE_URL
        prefix: /api/solo

    # ── 阶段 5 引擎接入：DB 密钥模型路由 + 特有工具 + 预览记录（完全自研，Host 面）────

    # 模型路由适配器：管理层每条启用配置 → 一条 soloengine-<id> 路由，秒级轮询热同步。
    # 适配器只注入 soloengineModelRoutes 服务（路由事实 + 已解密密钥），不读业务库、不持有主密钥。
    #
    # pollMs 必须**显著小于** NFR-PER-008 的 3 秒上界：轮询方案的最坏时延 =「一个周期 + 重算」，
    # 周期取得与上界相同（此处曾配 3000）必然越界——本机实测 3059ms > 3000ms 判定失败。
    # 1000ms 是适配器自身的默认值（见 @soloengine/llm-db-adapter 的 DEFAULT_POLL_MS 说明），
    # 最坏时延落在 1 秒量级，仍是 PRD-03/FR-ENG-015 所说的「秒级轮询」。
    - id: soloengine-llm-db-adapter
      name: '@soloengine/llm-db-adapter'
      config:
        pollMs: 1000

    # 特有工具：get_diagnostics（运行诊断）。
    - id: soloengine-tools
      name: '@soloengine/tools'

    # 预览记录：open_preview 工具 + soloengine/openPreview 会话投影。
    - id: soloengine-open-preview
      name: '@soloengine/open-preview'

    # ── 阶段 6 运行面板叠加：SoloEngine 自研浏览器面（dsh.client 行）────────────
    # 产品呈现叠加，会话数据不动：会话头工具座位、对话节点、URL 直达，全部经
    # 原生槽位与投影注册进入；品牌内容随 R194 改造官方 `ui-brand-official` 本体；
    # 阶梯 token 由 @soloengine/ui-theme 提供（一份定义两处消费）。

    # 设计语言阶梯（--se-space/z）：运行面板侧注入插件自有样式。
    - id: soloengine-ui-theme
      name: '@soloengine/ui-theme'

    # 会话头座位与对话节点与预览卡片：conversation.session.header.* + 键控 conversation.chat.node。
    - id: soloengine-ui-conversation
      name: '@soloengine/ui-conversation'

    # URL 直达会话：/run/:agenticFlowId → 该画布最近一次运行的原生会话选择（等列表基线就绪，未知键明确报错）。
    - id: soloengine-client-bootstrap
      name: '@soloengine/client-bootstrap'

    # ── 阶段 6b 操作区与文件树：五类现场围绕当前会话并列组织（PRD-08）────────────

    # 终端服务本体（PRD-06 FR-ENG-028）：持久 PTY 会话注册表 + owner 精确归属。
    # dsh-base/dsh-web-app 均不挂这两行，SoloEngine 显式装配（与官方 sdk-minimal 同法）。
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js "((process.env.SOLOENGINE_EXECUTOR ?? 'local') !== 'local' ? 'linux' : process.platform) === 'win32'"
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js "((process.env.SOLOENGINE_EXECUTOR ?? 'local') !== 'local' ? 'linux' : process.platform) !== 'win32'"
      config:
        shellDialect: pwsh
        timeoutMs: 300000
        # 受限档（workspace-write）只允许写工作区；Windows PowerShell 的 PSReadLine 每次接受一行都会
        # 追加 %APPDATA%\...\ConsoleHost_history.txt，被拒后重绘会吞掉该行（用户看到命令没执行）。
        # 在启动参数里关掉历史落盘：会话内上下键历史仍在内存中，跨进程历史不再写用户目录。
        shellArgs: ['-NoLogo', '-NoProfile', '-NoExit', '-Command', 'try { Set-PSReadLineOption -HistorySaveStyle SaveNothing } catch { }']

    # 终端六件套（open/send/read/signal/close/list）：模型显式操作指定终端会话。
    - id: tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'

    # 编辑器（R190）：查看归官方文档预览；编辑是新增的独立 tab 类型（kind `soloengine-editor`），
    # 只经官方文档动作座位显式打开，正文与保存走原生 workspaceFiles 读取/写回。
    - id: soloengine-ui-document-editor
      name: '@soloengine/ui-document-editor'

    # 操作区联动层 + 变更面板（呈现意图驱动 openResource/openTab；浏览器页签由官方本体承担）。
    - id: soloengine-ui-operation-area
      name: '@soloengine/ui-operation-area'

    # 浏览器同源代理（Host 面）：catch-all 持续代理 + SSRF 五条防线 + 链接重写 + WS 转发。
    - id: soloengine-browser-proxy
      name: '@soloengine/browser-proxy'
      config:
        prefix: /soloengine/proxy
        upgradePath: /soloengine/proxy-ws

    # ── 阶段 5 引擎接入：创造模式（dsh 官方插件，零改动，仅配组合）────────────────
    # 官方 dsh-tool-cordis 是创造模式的本体（定义/运行/停止/撤销插件 + 宿主与界面活树内省），
    # 出厂任何树都不挂载（官方标注 deliberate opt-in）；SoloEngine 在 Web 面启用它，
    # 使 agent 能扩展自身 harness。运行半侧（cordis-host-runner/cordis-client-runner）
    # 由 dsh-web-app bundle 提供。
    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'

# ── 覆盖（patch 整体替换该行 config，故每行重述它拥有的全部键）──────────────

# 执行世界的命令方言（R201）：容器形态的执行世界是 Linux 镜像，本机形态跟宿主平台。
# `ctx.shell` 的提供方（bash/pwsh 执行器）在这里按同一事实选一次；agent 预设里的命令工具
# 与上面的终端行读同一个事实。容器覆盖只替换 subprocess/sandbox 提供方，不再重复启停这些行。
- id: bash-sandbox
  disabled: !!js "((process.env.SOLOENGINE_EXECUTOR ?? 'local') !== 'local' ? 'linux' : process.platform) === 'win32'"

- id: pwsh-sandbox
  disabled: !!js "((process.env.SOLOENGINE_EXECUTOR ?? 'local') !== 'local' ? 'linux' : process.platform) !== 'win32'"

# 溢写（PRD-06 FR-ENG-023）：基线 dsh-base 已装载 spill-local + spill-policy（原生键 maxInlineTokens=12500）。
# 本层覆写为 PRD 规定的 5MB 目标：按约 4 字节/token 换算为 1,310,720 token，模型可见结果超过该阈值才溢写外存，
# 模型侧只见头尾预览 + 定位符。外存根固定到实例数据目录（v8 目录结构 data/spill/），不落系统临时目录。
# patch 整体替换 config，故两行各自重述它们拥有的全部键（基线 spill-local 无显式 config、
# spill-policy 仅 maxInlineTokens 一键；不得写原生 schema 不认的 maxInlineBytes）。
- id: spill-local
  config:
    root: !!js process.env.SOLOENGINE_ROOT + '/data/spill'

- id: spill-policy
  config:
    maxInlineTokens: 1310720

# dsh 的非会话 KV（workspace 注册、投影缓存）后端与全文检索索引都属于数据库形态：
# 单机走 SQLite（storage-sqlite + 独立派生索引文件），云走 PostgreSQL（storage-postgres
# + search schema），见形态覆盖文件。

# 技能发现的自定义根：框架层启用中的技能目录（PRD-04 接线）。
- id: skill-filesystem
  config:
    customSkillDirs:
      - !!js process.env.SOLOENGINE_SKILLS_DIR

# 运行面板不设「模型/凭据」入口：模型配置与密钥属框架层（PRD-03 FR-LLM-008）。
- id: ui-settings-models
  disabled: true

# 目录选择钉在**页内浏览**形态（替换基线 `directory-picker-auto` 的自适应选择）。
# 产品是 Web 控制台：远程/局域网访问时宿主桌面上的 OS 选择器无法驱动，且本机实测原生对话框
# 会在无人操作时直接返回路径（一次误启动即在工作区之外建运行）。门面仍是同一个
# `ctx.directoryPicker` seam，只换后端与前端两行；运行面板里的「添加工作区」使用同一套页内对话框。
# 注意：产品不再自建任何目录对话框——运行入口用受管工作根直接启动，选择动作只在面板里发生。
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# ── 阶段 7：文件变更记录与撤回（PRD-09）───────────────────────────────────────
# 主干 @anionex/dsh-turn-rewind 的自动回合检查点基线关闭，由 SoloEngine 侧按工作区边界开启
# （packages/soloengine/host/src/file-changes.ts 的 syncTrunkCheckpointMode）：主干的自动实现
# 按 cwd 向上解析「所属 Git 仓库」，当运行项目目录不是 Git 工作树根（例如位于某个仓库内的普通
# 目录）时会解析到沙箱**之外**的外层仓库并快照走那棵树（含读取沙箱外文件），与本产品
# 「沙箱根 = 运行项目目录」的唯一归属（PRD-10 FR-SEC-001）冲突。
# 故基线为 off（安全方向失败），仅在「活跃工作区全部是 Git 工作树根」时切到 git-native。
- id: turn-rewind
  config:
    turnCheckpointMode: off

# ── 阶段 7：权限档位（PRD-10 FR-SEC-003/006）─────────────────────────────────
# 预设表**不重述**：原生 base 层已声明只读 / 工作区可写 / 白名单自动 / 完全访问四档；
# 第四档 `approve-for-me` 的规则判定在原生 `permission` 实现体内（原三档不动、2 种策略不变）。
# 本层只做一件事：运行时把画布选定的档位（原生预设名）经 `permissionPresets.set` 写入会话
# （packages/soloengine/host/src/permission-allowlist.ts）；缺失服务或未知预设名在创建运行前 fail loud。

# ── 阶段 6b：同一功能只装载一个插件（PRD-08 §1）──────────────────────────────
# 文件树（R187）、终端（R188）、品牌（R194）与浏览器页签（R189）都已改造原包本体：
# 官方行保持启用，仓库无同名替代包。终端面板接的是本会话的 agent 终端（`ctx.terminals`），
# 其 HTTP 面就是官方 `api/terminal-controller` 新增的 owner 作用域方法。
#
# 浏览器：官方 `ui-sidebar-browser` 在 web-app 层只在 `desktop` profile 开启；本产品要求
# 所有形态都有浏览器页签，故在此对所有形态开启，并把 iframe 指向同源代理
# `@soloengine/browser-proxy`（SSRF 五条防线、链接重写、父页隔离都在该代理后端）。
# `proxyPrefix` 是官方包新增的 Host 配置（空即直连，保持上游行为）：目标被拒时页签呈现
# 代理返回的 code/message，而不是超时假死。
- id: ui-sidebar-browser
  disabled: false
  config:
    proxyPrefix: /soloengine/proxy
